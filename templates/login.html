<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <style>
        body { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; line-height: 1.5; background: #f4f5f7; color: #1f2933; margin: 0; }
        .box { width: 330px; margin: 90px auto; background: #fff; border: 1px solid #d5dae1; border-radius: 4px; padding: 26px; }
        h1 { font-size: 19px; font-weight: 600; margin: 0 0 18px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #3e4c5e; }
        input[type=password] { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #b9c1cc; border-radius: 3px; font-size: 15px; margin-bottom: 16px; }
        input:focus { outline: none; border-color: #2f5d9e; box-shadow: 0 0 0 2px #d7e3f5; }
        button { width: 100%; padding: 9px 14px; border: 1px solid #2f5d9e; border-radius: 3px; background: #2f5d9e; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
        button:hover { background: #274e87; }
        .err { border: 1px solid #e0bcbc; background: #fbeeee; border-radius: 4px; padding: 8px 12px; margin-bottom: 16px; color: #8a2c2c; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Đăng nhập quản trị</h1>
        {% if err %}<div class="err">{{ err }}</div>{% endif %}
        <form action="/login" method="post">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" required autofocus>
            <button type="submit">Đăng nhập</button>
        </form>
    </div>
</body>
</html>
